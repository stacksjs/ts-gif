name: Releaser
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pantry-pm/pantry/packages/action@d160044a6fe4ad7e8463828f80dfbc55bcdc07d9
        with:
          version: '0.11.109'
          install: 'false'
          packages: bun.com@1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      # Publishing is authenticated by the npm trusted publisher for release.yml.
      - run: pantry publish --npm --access public
      - uses: stacksjs/action-releaser@v1.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
